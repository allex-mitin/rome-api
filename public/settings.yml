# Демо-конфигурация. Спецификации лежат в `public/test/` и разложены по сценариям:
#   single-file/ — спецификация в одном файле (внешних $ref нет)
#   multi-file/  — спецификация, разбитая на файлы: схемы и сообщения через $ref
#   versions/    — несколько версий спецификации, переиспользующих общие файлы
#   invalid/     — спецификации с ошибками валидации (панель валидации)
#   missing/     — файлов нет намеренно: сервис демонстрирует несуществующую спеку (404)

# Брендирование шапки. Секция необязательна: всё, что здесь не указано, берётся из значений
# по умолчанию (`src/helpers/branding.ts`). Файл читается браузером при загрузке страницы и лежит
# рядом со сборкой, поэтому шапку можно перебрендировать под свою организацию без пересборки —
# достаточно отредактировать этот файл и перезагрузить страницу.
branding:
  title: Rome API
  subtitle: View API documentation service
  # logo: /branding/logo.svg  # адрес картинки; иначе используется логотип, вшитый в сборку
  # logoAlt: ACME
  # logoHeight: 32            # высота логотипа в пикселях
  # link: /                   # куда ведут логотип и название; внешний URL откроется в новой вкладке
  # background: "#f8fafc"      # фон шапки: цвет, градиент или url(...); по умолчанию чуть темнее страницы
  # textColor: "#101828"
  # accentColor: "#4696e5"    # выбранный сервис, рамка поиска в фокусе, ховер в выдаче
  # documentTitle: Rome API   # заголовок вкладки браузера
  # favicon: /branding/favicon.ico

# Настройки рендереров. Секция необязательна: значения ниже — дефолты приложения
# (`src/helpers/rendererOptions.ts`). Их можно переопределить здесь — сразу для всех сервисов —
# либо у конкретной спеки, в её секции `options` (пример — сервис `multi-file` ниже).
renderers:
  # Прокидывается в <SwaggerUI> (swagger-ui-react). Он передаёт рендереру фиксированный список
  # пропсов, всё остальное молча отбрасывается (maxDisplayedTags, fn, syntaxHighlight — мимо).
  # Ключи-функции и массивы (presets, plugins, requestInterceptor, onComplete) — только для settings.js.
  openapi:
    docExpansion: list              # list | full | none
    filter: true                    # встроенный фильтр по тегам
    defaultModelsExpandDepth: -1    # -1 — секция Models закрыта (важно для больших спек)
    deepLinking: true
    # tryItOutEnabled: true
    # supportedSubmitMethods: [get, post, put, delete]
    # displayOperationId: true
    # persistAuthorization: true
  # Прокидывается в config компонента @asyncapi/react-component.
  asyncapi:
    schemaID: asyncapi
    show:
      sidebar: false
      info: true
      servers: true
      operations: true
      messages: true
      messageExamples: true
      schemas: true
      errors: true
    # expand:
    #   messageExamples: true
    # sidebar:
    #   showServers: byDefault      # byDefault | bySpecTags | byServersTags
    #   showOperations: byDefault   # byDefault | bySpecTags | byOperationsTags
    #   useChannelAddressAsIdentifier: true
    # publishLabel: Отправить
    # subscribeLabel: Подписаться

services:
  - path: "single-file"
    name: Спека одним файлом
    openapi:
      url: /test/single-file/openapi.json
    asyncapi:
      url: /test/single-file/asyncapi.yaml
  - path: "multi-file"
    name: Спека из нескольких файлов
    openapi:
      url: /test/multi-file/openapi.yaml
      # options:                  # переопределяет renderers.openapi только для этой спеки
      #   docExpansion: full      # ключи сливаются рекурсивно
    asyncapi:
      url: /test/multi-file/asyncapi.yaml
  - path: "versions"
    name: Версии спецификаций
    openapi:
      urls:
        "0.0.1": /test/versions/openapi-0.0.1.yaml
        "0.0.2": /test/versions/openapi-0.0.2.yaml
    asyncapi:
      urls:
        "1.0.0": /test/versions/asyncapi-1.0.0.yaml
        "2.0.0": /test/versions/asyncapi-2.0.0.yaml
  - path: "invalid"
    name: Спеки с ошибками валидации
    openapi:
      url: /test/invalid/openapi.json
    asyncapi:
      url: /test/invalid/asyncapi.yml
  - path: "missing"
    name: Спеки не существует (404)
    openapi:
      url: /test/missing/openapi.yaml
    asyncapi:
      url: /test/missing/asyncapi.yaml
  - path: "openapi-only"
    name: Только OpenAPI
    openapi:
      url: /test/single-file/openapi.json
  - path: "asyncapi-only"
    name: Только AsyncAPI
    asyncapi:
      url: /test/single-file/asyncapi.yaml
  - path: "no-specs"
    name: Сервис без спек
