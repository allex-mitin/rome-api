name: Release

# Каждый push в master собирает статику из ./build, кладёт её архивом в артефакты запуска,
# создаёт тег v<версия из package.json>-<номер сборки> и публикует GitHub Release с этим же архивом.
# Артефакт/архив затем вручную распаковывается и укладывается в docker-образ (nginx).
# Тот же запуск выкладывает демо в GitHub Pages (job `pages`) — вручную включается один раз:
# Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [master]
  # Ручной запуск нужен, чтобы пересобрать релиз, не трогая master
  # (перезапуск упавшего job'а переиспользует тот же номер сборки и тот же тег).
  workflow_dispatch:

# contents: write — создание тега и релиза от имени GITHUB_TOKEN.
permissions:
  contents: write

# Сборки идут по очереди: две одновременные не подерутся за создание тега.
concurrency:
  group: release-master
  cancel-in-progress: false

env:
  # Артефакты запуска временные (максимум 90 дней для публичного репозитория);
  # постоянная копия архива живёт в GitHub Release.
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version || '0.0.0'")"
          VERSION="${BASE_VERSION}-${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=rome-api-$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "Версия: $VERSION (база $BASE_VERSION, сборка #${{ github.run_number }})"
          echo "Коммит: ${{ github.sha }}"

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f build/index.html
          du -sh build
          ls -R build | head -50

      - name: Pack build
        run: |
          (cd build && zip -r "../${{ steps.version.outputs.archive }}" .)
          unzip -l "${{ steps.version.outputs.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.archive }}
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Publish tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          cat > release-notes.md <<NOTES
          Готовый билд RomeAPI версии \`$TAG\`.

          Содержимое архива — результат \`npm run build\` из \`build/\`:
          распаковать и положить в корень nginx-сайта (см. \`deploy/nginx.conf.example\`).
          Рядом кладутся \`settings.yml\` и файлы спецификаций.

          Коммит: ${{ github.sha }}
          Сборка: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          \`\`\`bash
          gh release download $TAG --repo ${{ github.repository }} --pattern '*.zip'
          \`\`\`
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Повторный запуск того же workflow run: релиз уже есть, обновляем архив.
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "${{ github.sha }}" \
              --title "RomeAPI $TAG" \
              --notes-file release-notes.md
          fi

          gh release view "$TAG" --json tagName,name,assets --jq '{tag: .tagName, name: .name, assets: [.assets[].name]}'

  # Публикация демо на GitHub Pages. Job живёт в этом же workflow, а не в отдельном на `release:
  # published`: события, созданные `GITHUB_TOKEN`-ом, не запускают другие workflow, так что
  # отдельный workflow не проснулся бы на релиз, сделанный шагом выше.
  pages:
    name: Deploy to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    # Pages принимает одну публикацию за раз; отменять начатую нельзя — деплой станет «залипшим».
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Страница проекта на Pages отдаётся из подпути (`https://<owner>.github.io/<repo>/`) и это
      # надо зашить в сборку: пути к ассетам раскручиваются от `base` (`VITE_BASE_PATH`
      # в vite.config.mts). Под своим доменом или на user-site база — `/`.
      - name: Resolve base path
        id: base
        run: |
          echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          echo "База для Pages: /${GITHUB_REPOSITORY#*/}/"

      # Сборка вторая по счёту: у архива для nginx база `/` (его кладут в корень сайта), у Pages —
      # подпуть, а `base` вшивается в `index.html` на этапе сборки, и задним числом его не сменить.
      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Add SPA fallback
        run: |
          test -f build/index.html
          test -f build/settings.yml
          # Роутинг — createBrowserRouter с «настоящими» путями, а у Pages нет try_files: незнакомый
          # путь он отдаёт как 404.html (код 404, но SPA стартует и отрисовывает нужный маршрут).
          # Без этой копии прямой переход по ссылке и перезагрузка страницы ломаются.
          cp build/index.html build/404.html
          du -sh build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
