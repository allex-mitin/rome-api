name: Release

# Каждый push в master собирает статику из ./build, кладёт её архивом в артефакты запуска,
# создаёт тег v<major.minor.patch> (major.minor берётся из package.json, patch — следующий за
# максимальным среди уже опубликованных релизов этой же major.minor) и публикует GitHub Release
# с этим же архивом.
# Артефакт/архив затем вручную распаковывается и укладывается в docker-образ (nginx).
#
# Сборка ровно ОДНА на весь workflow: она относительная (`base: './'`), поэтому один и тот же
# архив годится и для корня nginx-сайта, и для подпути, и для демо в Pages. Путь монтирования
# задаётся не сборкой, а тегом `<base href="/">` в `index.html`, который есть в архиве: хост с
# подпутём заменяет этот тег и ничего не пересобирает.
# Тот же запуск выкладывает демо в GitHub Pages (job `pages`, берёт артефакт этой же сборки) —
# вручную включается один раз: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [master]
  # Ручной запуск нужен, чтобы пересобрать релиз, не трогая master
  # (перезапуск упавшего job'а переиспользует тот же номер сборки и тот же тег).
  workflow_dispatch:

# contents: write — создание тега и релиза от имени GITHUB_TOKEN.
permissions:
  contents: write

# Сборки идут по очереди: две одновременные не подерутся за создание тега.
concurrency:
  group: release-master
  cancel-in-progress: false

env:
  # Артефакты запуска временные (максимум 90 дней для публичного репозитория);
  # постоянная копия архива живёт в GitHub Release.
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    # Имя артефакта = версия: job `pages` не собирает заново, а скачивает артефакт этой сборки.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Читаем версию и оставляем только major.minor (например, из "1.2.0" или "1.2" получаем "1.2").
          # Никаких regex-замен: внутри двойных кавычек bash раскрыл бы '$1' в пустую строку,
          # и replace(...) вернул бы "" — отсюда фолбэк '0.0' и падение шага. Режем версию split'ом.
          BASE_VERSION="$(node -p "const [major = '0', minor = '0'] = require('./package.json').version.split('.'); major + '.' + minor")"
          
          if [ -z "$BASE_VERSION" ] || [ "$BASE_VERSION" = "0.0" ]; then
            echo "::error::Не удалось определить major.minor из package.json"
            exit 1
          fi

          # 2. Ищем максимальный patch среди существующих тегов вида v<major>.<minor>.*
          # Только --json/--jq: обычная таблица `gh release list` печатает первой колонкой TITLE,
          # а не тег (у нас title = "RomeAPI v0.1.0"), и awk '{print $1}' давал "RomeAPI".
          # Вызов вынесен из пайпа и проверяется явно: в пайпе код возврата gh теряется, а молчаливое
          # «пусто» здесь означало бы patch=0 и перезапись уже опубликованного релиза (`--clobber`).
          if ! RELEASES=$(gh release list --limit 100 --json tagName --jq '.[].tagName'); then
            echo "::error::gh release list не отработал — patch вычислить нечем (проверь GITHUB_TOKEN и права contents: write)"
            exit 1
          fi

          # sort -V сортирует версии правильно (1.2.9 < 1.2.10)
          LAST_TAG=$(printf '%s\n' "$RELEASES" \
            | grep -E "^v${BASE_VERSION//./\\.}\.[0-9]+$" \
            | sort -V \
            | tail -n 1 || true)

          # 3. Вычисляем новый patch
          if [ -n "$LAST_TAG" ]; then
            LAST_PATCH=$(echo "$LAST_TAG" | grep -oE '[0-9]+$')
            NEW_PATCH=$((LAST_PATCH + 1))
          else
            # Если тегов для этой major.minor ещё нет, начинаем с 0
            NEW_PATCH=0
          fi

          VERSION="${BASE_VERSION}.${NEW_PATCH}"
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=rome-api-$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "📦 Новая версия: $VERSION (из package.json: ${BASE_VERSION}.x, предыдущий тег: ${LAST_TAG:-нет})"
          echo "Коммит: ${{ github.sha }}"

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f build/index.html
          # Относительная база: ссылки на ассеты, иконку и на settings.js — от документа, а не от корня сайта.
          # Если здесь появятся корневые пути (/assets/...), сборка перестанет работать в подпути.
          grep -q 'src="./assets/' build/index.html
          grep -q 'href="./assets/' build/index.html
          grep -q 'src="./settings.js"' build/index.html
          # Единственная точка конфигурации пути: её заменяет хост, отдающий UI из подпути
          # (стартер подставляет свой `romeapi.path`, Pages — имя репозитория).
          test "$(grep -c '<base href="/" />' build/index.html)" = "1"
          du -sh build
          ls -R build | head -50

      - name: Pack build
        run: |
          (cd build && zip -r "../${{ steps.version.outputs.archive }}" .)
          unzip -l "${{ steps.version.outputs.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.archive }}
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Publish tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          cat > release-notes.md <<NOTES
          Готовый билд RomeAPI версии \`$TAG\`.

          Содержимое архива — результат \`npm run build\` из \`build/\`:
          распаковать и положить в корень nginx-сайта (см. \`deploy/nginx.conf.example\`).
          Рядом кладутся \`settings.yml\` и файлы спецификаций.

          **Один архив на все варианты развёртывания.** Билд относительный и не знает своего пути:
          в корне сайта он работает как есть, а для подпути (\`/api-ui/\` у Spring Boot стартера,
          \`/rome-api/\` на Pages) достаточно заменить в \`index.html\` один тег —
          \`<base href="/">\` на \`<base href="/api-ui/">\`. Пересборка не нужна.

          Коммит: ${{ github.sha }}
          Сборка: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          \`\`\`bash
          gh release download $TAG --repo ${{ github.repository }} --pattern '*.zip'
          \`\`\`
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Повторный запуск того же workflow run: релиз уже есть, обновляем архив.
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "${{ github.sha }}" \
              --title "RomeAPI $TAG" \
              --notes-file release-notes.md
          fi

          gh release view "$TAG" --json tagName,name,assets --jq '{tag: .tagName, name: .name, assets: [.assets[].name]}'

  # Публикация демо на GitHub Pages. Job живёт в этом же workflow, а не в отдельном на `release:
  # published`: события, созданные `GITHUB_TOKEN`-ом, не запускают другие workflow, так что
  # отдельный workflow не проснулся бы на релиз, сделанный шагом выше.
  pages:
    name: Deploy to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    # Pages принимает одну публикацию за раз; отменять начатую нельзя — деплой станет «залипшим».
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Сборка здесь НЕ повторяется: страница проекта живёт в подпути
      # (`https://<owner>.github.io/<repo>/`), но это решается одним тегом в готовом `index.html`,
      # а не вторым билдом. Артефакт — тот же архив, что уехал в релиз.
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.release.outputs.version }}
          path: artifact

      - name: Unpack artifact
        run: |
          unzip -q artifact/*.zip -d build
          test -f build/index.html
          test -f build/settings.yml
          du -sh build

      # Единственная правка под подпуть: `<base href="/">` → `<base href="/<repo>/">`.
      # От неё зависят и ассеты (`./assets/...`), и рантайм-база внутри бандла (`appBase()`
      # в src/helpers/index.ts: settings.yml, URL спек, basename роутера).
      - name: Point the build at the Pages sub-path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          test "$(grep -c '<base href="/" />' build/index.html)" = "1"
          # Без `sed -i`: этот же однострочник приводится в README и должен работать и на GNU sed,
          # и на BSD (macOS), где `-i` требует аргумент.
          sed "s|<base href=\"/\" />|<base href=\"/$REPO/\" />|" build/index.html > patched.html
          mv patched.html build/index.html
          grep -q "<base href=\"/$REPO/\" />" build/index.html
          echo "База для Pages: /$REPO/"

      - name: Add SPA fallback
        run: |
          # Роутинг — createBrowserRouter с «настоящими» путями, а у Pages нет try_files: незнакомый
          # путь он отдаёт как 404.html (код 404, но SPA стартует и отрисовывает нужный маршрут).
          # Копия берётся после правки базы — иначе прямой переход в подпуть остался бы без неё.
          # Без этой копии прямой переход по ссылке и перезагрузка страницы ломаются.
          cp build/index.html build/404.html
          du -sh build

      # Демо-спецификации едут на Pages вместе со статикой: Vite копирует `public/` (а в нём лежит
      # `test/`) в `build/` как есть, так что в артефакте они уже есть. Без фикстур демо открывается
      # без спек, и заметно это было бы только на живой странице — поэтому проверяем здесь.
      - name: Verify demo specs in artifact
        run: |
          test -f build/settings.js
          test -f build/test/single-file/openapi.json
          test -f build/test/single-file/asyncapi.yaml
          test -f build/test/multi-file/openapi.yaml
          test -f build/test/multi-file/asyncapi.yaml
          test -f build/test/versions/openapi-0.0.2.yaml
          test -f build/test/invalid/openapi.json
          # `test/missing/` отсутствует намеренно: это сценарий «спеки не существует (404)».
          echo "Файлов в build/test: $(find build/test -type f | wc -l)"
          find build/test -mindepth 1 -maxdepth 1 -type d | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
